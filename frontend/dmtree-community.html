<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DMTree Community — Weiterleitung</title>
  <meta http-equiv="refresh" content="0; url=http://127.0.0.1/" />
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var port = params.get('port') || '80';
      var base = 'http://127.0.0.1' + (port === '80' ? '' : ':' + port) + '/';
      window.location.replace(base);
    })();
  </script>
</head>
<body>
  <p>
    Weiterleitung zu <a href="http://127.0.0.1/">http://127.0.0.1/</a>
    (Docker-Frontend, Port 80). Anderen Port in <code>.env</code>?
    Dann diese Datei mit <code>?port=DEIN_PORT</code> oeffnen, z. B.
    <a href="http://127.0.0.1/dmtree-community.html?port=3000">?port=3000</a>.
  </p>
</body>
</html>
